function previousWave(){let n=Number(prompt('Numărul valului (1–6)'));if(n>=1&&n<=6){let previous=msg(waveTasks(n));$('extra').textContent=previous;copy(previous)}}function showMessage(d){$('extra').textContent=msg(tasks.filter(t=>t.day===d))}function sent(){let s=sh();if(!ready()||s.waves.length>=6||s.start&&remaining(s)<=0)return;if(!confirm('Confirmați că mesajul a fost trimis grupului corect?'))return;let now=Date.now();if(!s.start)s.start=now;s.waves.push(now);state.shifts[shift]=s;log(shift+' val '+s.waves.length+' trimis');render()}

function selectTask(id){task=id;draft=null;render()}function changeTeam(e){team=Number(e);draft=null;render()}function changeDay(d){day=d;task=tasks.find(t=>t.day===d).id;draft=null;render()}
function validation(){let ts=tasks.filter(t=>t.day===day),t=ts.find(x=>x.id===task)||ts[0];task=t.id;let r=rec(team,task);if(!draft)draft={votes:[...(r.votes||[])],value:r.value,note:r.note};return `<section><h2>Validare și vot</h2><div class="grid"><div><label>Echipă</label><select onchange="changeTeam(this.value)">${opts(teams,team)}</select></div><div><label>Secțiune</label><select onchange="changeDay(this.value)">${opts(days,day)}</select></div><div><label>Task</label><select onchange="selectTask(this.value)">${ts.map(x=>`<option value="${x.id}" ${x.id===task?'selected':''}>${x.id} – ${esc(x.title)}</option>`).join('')}</select></div></div><h3>${t.id} – ${esc(t.title)}</h3><label for="taskEdit">Textul taskului pentru participanți</label><textarea id="taskEdit" rows="7">${esc(taskText(t))}</textarea><p class="muted">Modificarea se aplică tuturor echipelor și mesajelor valurilor. Soluția și indiciile interne nu se modifică automat.</p>${btn('Salvează textul','saveTaskText(false)','alt')}${btn('Salvează și copiază','saveTaskText(true)')}${btn('Copiază taskul salvat','copy(msg([tasks.find(t=>t.id===task)]))','alt')}${btn('Revino la original','resetTaskText()','alt')}<p><b>Criterii:</b> ${esc(t.criteria)}</p>${t.solution?`<details open><summary>Soluție internă</summary><p>${esc(t.solution)}</p></details>`:''}${t.hints.length?`<h3>Indicii: ${r.hints}/3</h3>${t.hints.map((h,i)=>`<p>${i<r.hints?esc(h):'Indiciu '+(i+1)+' ascuns'} ${i<r.hints?btn('Copiază',`copy(tasks.find(t=>t.id===task).hints[${i}])`,'alt'):i===r.hints?btn('Acordă și copiază',`hint(${i})`):''}</p>`).join('')}`:''}<p>Statut salvat: <b>${({ok:'VALIDAT',no:'NEVALIDAT',skip:'ABANDONAT',pending:'În așteptare'})[r.status]}</b> · ${points(team,t)} puncte</p>${['BNS02','BNS03','BNS04'].includes(task)?`<label>${task==='BNS02'?'Înălțime (cm)':task==='BNS03'?'Valoare nouă (lei)':'Persoane eligibile'}</label><input type="number" min="0" step="${task==='BNS03'?'0.01':'1'}" value="${esc(draft.value)}" oninput="draft.value=this.value">`:''}<label>Observații / dovadă / sursă preț / motiv corecție</label><textarea rows="3" oninput="draft.note=this.value">${esc(draft.note)}</textarea><label>Decizia Consiliului Veteranilor</label><div class="quick"><button class="positive" onclick="quickDecision(true)">✓ Validat</button><button class="negative" onclick="quickDecision(false)">✕ Nevalidat</button>${btn('Abandonat','abandon()','alt')}</div><p class="muted">Bifați rezultatul votului majoritar deja desfășurat. Decizia se salvează imediat după confirmare.</p><details><summary>Opțional: înregistrează voturile individuale</summary><label>Voturi (3 veterani, majoritate 2)</label>${[0,1,2].map(i=>`<div>Veteran ${i+1} ${btn('Da',`vote(${i},true)`,draft.votes[i]===true?'':'alt')}${btn('Nu',`vote(${i},false)`,draft.votes[i]===false?'':'alt')} ${draft.votes[i]===true?'✓':draft.votes[i]===false?'✕':'—'}</div>`).join('')}<p id="decision">${decision()}</p>${btn('Salvează decizia','commit()')}${btn('Resetează voturile','draft.votes=[];render()','alt')}</details></section>`}
function saveTaskText(andCopy){let t=tasks.find(t=>t.id===task),v=$('taskEdit').value.trim();if(!v)return alert('Textul nu poate fi gol.');if(v!==taskText(t)){state.edits=state.edits||{};state.edits[task]=v;log(task+' text participanți modificat');}if(andCopy)copy(msg([t]));else alert('Text salvat pentru toate echipele.');}function resetTaskText(){if(!confirm('Revii la enunțul original?'))return;if(state.edits)delete state.edits[task];log(task+' text original restaurat');render()}function quickDecision(valid){if(!confirm('Confirmați decizia majoritară a Consiliului: '+(valid?'VALIDAT':'NEVALIDAT')+'?'))return;commit(valid?'Majoritate DA':'Majoritate NU',true)}function decision(){let y=draft.votes.filter(v=>v===true).length,n=draft.votes.filter(v=>v===false).length;return y>=2?'Majoritate DA':n>=2?'Majoritate NU':'Vot incomplet'}function vote(i,v){draft.votes[i]=v;render()}function hint(i){let r=rec(team,task);if(r.hints!==i||!confirm('Înregistrați indiciul '+(i+1)+'?'))return;r={...r,hints:i+1};setrec(team,task,r);log('E'+team+' '+task+' indiciu '+(i+1));copy(tasks.find(t=>t.id===task).hints[i]);render()}
function commit(result=null,quick=false){let d=result||decision();if(d==='Vot incomplet')return alert('Sunt necesare minimum două voturi identice.');let v=Number(draft.value)||0;if(d==='Majoritate DA'&&((task==='BNS02'&&v<=0)||(task==='BNS03'&&v<=0)||(task==='BNS04'&&(v<5||!Number.isInteger(v)))))return alert('Valoare neeligibilă.');let old=rec(team,task);if(old.status!=='pending'&&!draft.note.trim())return alert('Notați motivul corecției.');let r={...old,...draft,votes:quick?[]:draft.votes,value:v,status:d==='Majoritate DA'?'ok':'no'};setrec(team,task,r);log('E'+team+' '+task+' '+old.status+' → '+r.status+(quick?' (decizie Consiliu)':'')+'; '+r.note);draft=null;render()}function abandon(){if(!confirm('Abandon definitiv pentru această probă?'))return;let r=rec(team,task);setrec(team,task,{...r,status:'skip',note:draft.note});log('E'+team+' '+task+' abandon');draft=null;render()}
function bonuses(){return `<section><h2>Bonusuri • ambele zile</h2><div class="scroll"><table><tr><th>Echipă</th>${tasks.filter(t=>t.kind==='Bonus').map(t=>`<th>${esc(t.title)}</th>`).join('')}</tr>${teams.map(e=>`<tr><th>E${e}</th>${tasks.filter(t=>t.kind==='Bonus').map(t=>`<td>${rec(e,t.id).status==='ok'?esc(rec(e,t.id).value||'✓'):'—'} · ${points(e,t)} pct.<br>${btn('Validare',`team=${e};day='Bonusuri';task='${t.id}';draft=null;go('Validare')`,'alt')}</td>`).join('')}</tr>`).join('')}</table></div><p>Trade: 1 punct/leu întreg, max. 100. Fotografie: 2/persoană, min. 5, max. 50. Înălțime: 25 pentru maximul validat, inclusiv egalități.</p></section>`}
let rankfilter='all';function ranking(){let rows=teams.map(e=>({e,p:total(e,rankfilter)})).sort((a,b)=>b.p-a.p);return `<section><h2>Clasament confidențial</h2><select onchange="rankfilter=this.value;render()">${opts(['all',...days],rankfilter)}</select><table><tr><th>Loc</th><th>Echipă</th><th>Puncte</th></tr>${rows.map((r,i)=>`<tr><td>${rows.findIndex(x=>x.p===r.p)+1}</td><td>Echipa ${r.e}</td><td class="big">${r.p}</td></tr>`).join('')}</table>${btn('Prezentare clasament','present()')}</section>`}function present(){let w=window.open('','_blank');if(!w)return alert('Permiteți ferestrele pop-up.');w.document.write('<title>BGCON Clasament</title><style>body{background:#123b59;color:white;font:32px system-ui;padding:5vw}li{padding:12px}</style><h1>BGCON 2026 • Clasament</h1><ol>'+teams.map(e=>({e,p:total(e,rankfilter)})).sort((a,b)=>b.p-a.p).map(r=>`<li>Echipa ${r.e} — ${r.p} puncte</li>`).join('')+'</ol>');w.document.close()}
function history(){return `<section><h2>Istoric</h2>${state.log.map(l=>`<p><small>${esc(l.time)}</small> — ${esc(l.action)}</p>`).join('')||'Nicio înregistrare.'}</section>`}function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){return `<section><h2>Backup</h2>${btn('Export JSON','download("BGCON-backup.json",JSON.stringify(state,null,2),"application/json")')}${btn('Export CSV','csv()','alt')}<label>Import backup (înlocuiește datele)</label><input type="file" accept=".json" onchange="restore(this)"><p>Nu ștergeți datele browserului. Păstrați fișierul de backup separat.</p></section>`}function csv(){download('BGCON-clasament.csv','Echipa;Puncte\n'+teams.map(e=>e+';'+total(e)).join('\n'),'text/csv')}async function restore(el){try{let s=JSON.parse(await el.files[0].text());if(!s.records||!s.shifts||!Array.isArray(s.log))throw Error();if(confirm('Înlocuiți datele curente?')){state=s;save();draft=null;render()}}catch{alert('Backup invalid.')}}
</script></html>
